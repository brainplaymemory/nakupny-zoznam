<style>
body {
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    margin: 0;
    padding: 20px;
    text-align: center;
    color: #333;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}


/* =========================
   ÚVODNÁ STRÁNKA
   ========================= */

#languageScreen {
    min-height: calc(100vh - 40px);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
}

#languageScreen.active {
    display: flex;
}

.language-title {
    margin-bottom: 10px;
}

.language-title h1 {
    font-size: 42px;
    margin: 0 0 12px;
    color: #555;
    letter-spacing: 1px;
}

.language-icon {
    font-size: 48px;
    margin-bottom: 8px;
}

.language-title h2 {
    font-size: 24px;
    font-weight: normal;
    margin: 0;
    color: #555;
}

.language-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 35px;
}

.language-button {
    width: 180px;
    height: 105px;
    border: none;
    border-radius: 18px;
    font-size: 25px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.language-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 7px 14px rgba(0,0,0,0.17);
}

.language-button:active {
    transform: translateY(0);
}

.language-sk {
    background: linear-gradient(
        to bottom,
        #ffffff 0%,
        #ffffff 33%,
        #dce9f5 33%,
        #dce9f5 66%,
        #f1c9cd 66%,
        #f1c9cd 100%
    );
}

.language-en {
    background: linear-gradient(
        to bottom,
        #f2c4c7 0%,
        #f2c4c7 33%,
        #ffffff 33%,
        #ffffff 66%,
        #cbdced 66%,
        #cbdced 100%
    );
}

.language-it {
    background: linear-gradient(
        to bottom,
        #d4eadb 0%,
        #d4eadb 33%,
        #ffffff 33%,
        #ffffff 66%,
        #f1cccc 66%,
        #f1cccc 100%
    );
}


/* =========================
   NASTAVENIE
   ========================= */

h1 {
    margin-bottom: 10px;
}

h2 {
    margin-top: 10px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 16px;
    cursor: pointer;
    color: #333;
}

button:hover {
    opacity: 0.9;
}

.setup-group {
    margin: 20px 0;
}

.theme-buttons,
.name-buttons,
.level-buttons,
.time-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 15px 0;
}


/* =========================
   JEMNÉ FARBY TLAČIDIEL
   ========================= */

.theme-buttons button {
    background: #eee4d6;
}

.name-buttons button {
    background: #dce8f0;
}

.level-buttons button {
    background: #dfeadf;
}

.time-buttons button {
    background: #e7e1ed;
}


/* VYBRANÉ TLAČIDLO */

.selected {
    background: #cbd9d5 !important;
    box-shadow: inset 0 0 0 2px #aebfba;
}


/* ZAČAŤ HRAŤ / NOVÁ HRA */

.start-button {
    background: #c8d4d8;
    color: #333;
    margin-top: 15px;
}

.start-button:hover {
    background: #b9c8cd;
}


/* SPÄŤ */

.back-button {
    background: #e7e7e7;
    margin-top: 20px;
}


/* =========================
   HRA
   ========================= */

.instructions {
    font-size: 21px;
    margin: 20px 0;
}

.memory-items {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    max-width: 900px;
    margin: 25px auto;
}

.memory-item {
    font-size: 24px;
    padding: 15px 20px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.08);
}

.memory-item .emoji {
    font-size: 55px;
    display: block;
    margin-bottom: 5px;
}


/* =========================
   ODPOVEDE
   ========================= */

.answers {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    max-width: 1100px;
    margin: 25px auto;
}

.answer {
    width: 175px;
    min-height: 120px;
    padding: 15px;
    font-size: 18px;
    box-sizing: border-box;
}

.answer .emoji {
    font-size: 70px;
    display: block;
    margin-bottom: 5px;
}


/* SPRÁVNA / NESPRÁVNA */

.correct {
    background: #b8dfb8 !important;
}

.incorrect {
    background: #efb0b0 !important;
}

.missed {
    background: #b8dfb8 !important;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.35;
    }
}


/* =========================
   ŠTATISTIKY
   ========================= */

.stats {
    margin: 15px 0;
    font-size: 17px;
}

.message {
    min-height: 30px;
    font-size: 20px;
    font-weight: bold;
    margin: 15px 0;
}

.return-link {
    display: inline-block;
    margin-top: 20px;
    color: #555;
    text-decoration: none;
    font-size: 15px;
}

.return-link:hover {
    text-decoration: underline;
}
/* =========================
   MOBILNÁ VERZIA
   ========================= */

/* =========================

   ========================= */

let currentLanguage = "SK";

let selectedTheme = "shopping";

let selectedNameLanguage = "SK";

let selectedLevel = 4;

let selectedTime = 5;

let gameFinished = false;

let bestTime = null;


/* =========================
   VÝBER JAZYKA
   ========================= */

function chooseLanguage(language) {

    currentLanguage = language;

    document.getElementById("languageScreen")
        .classList.remove("active");

    document.getElementById("setupScreen")
        .classList.add("active");

    updateTexts();
}


/* =========================
   NÁVRAT NA HLAVNÚ STRÁNKU
   ========================= */

function showLanguageScreen() {

    clearInterval(timerInterval);

    document.getElementById("setupScreen")
        .classList.remove("active");

    document.getElementById("gameScreen")
        .classList.remove("active");

    document.getElementById("languageScreen")
        .classList.add("active");
}


/* =========================
   PREKLADY
   ========================= */

function updateTexts() {

    const t = texts[currentLanguage];

    document.getElementById("setupTitle").textContent =
        t.setupTitle;
    
    document.getElementById("gameTitle").textContent =
    t.setupTitle;

    document.getElementById("themeTitle").textContent =
        t.themeTitle;

    document.getElementById("themeShopping").textContent =
        t.shopping;

    document.getElementById("themeHousehold").textContent =
        t.household;

    document.getElementById("themeClothes").textContent =

    document.getElementById("nameTitle").textContent =
        t.nameTitle;

    document.getElementById("levelTitle").textContent =
        t.levelTitle;

    document.getElementById("timeTitle").textContent =
        t.timeTitle;

    document.querySelector(

    ).textContent = t.easy;

    document.querySelector(
        ".level-buttons button:nth-child(2)"
    ).textContent = t.medium;

    ).textContent = t.hard;

    ).textContent = t.seconds3;

    document.querySelector(

    ).textContent = t.seconds5;

    document.querySelector(
        ".time-buttons button:nth-child(3)"
    ).textContent = t.seconds10;

    document.querySelector(
        ".time-buttons button:nth-child(4)"
    ).textContent = t.seconds15;

    document.getElementById("startButton").textContent =
        t.start;

    document.getElementById("backButton").textContent =
        t.back;

    document.getElementById("newGameButton").textContent =
        t.newGame;

    document.getElementById("returnLink").textContent =
        t.returnHome;
}


/* =========================
   TÉMA
   ========================= */

function selectTheme(theme) {

    selectedTheme = theme;

    document.querySelectorAll(".theme-buttons button")
        .forEach(button => {
            button.classList.remove("selected");
        });

    if (theme === "shopping") {
        document.getElementById("themeShopping")
            .classList.add("selected");
    }

    if (theme === "household") {
        document.getElementById("themeHousehold")
            .classList.add("selected");
    }

    if (theme === "clothes") {
        document.getElementById("themeClothes")
            .classList.add("selected");
    }
}


/* =========================
   JAZYK NÁZOV
   ========================= */

function selectNameLanguage(language) {

    selectedNameLanguage = language;

    document.querySelectorAll(".name-buttons button")
        .forEach(button => {
            button.classList.remove("selected");
        });

    const buttons =
        document.querySelectorAll(".name-buttons button");

    if (language === "SK") {
        buttons[0].classList.add("selected");
    }

    if (language === "EN") {
        buttons[1].classList.add("selected");
    }

    if (language === "IT") {
        buttons[2].classList.add("selected");
    }
}


/* =========================
   ÚROVEŇ
   ========================= */

function selectLevel(level) {

    selectedLevel = level;

    document.querySelectorAll(".level-buttons button")
        .forEach(button => {
            button.classList.remove("selected");
        });

    const buttons =
        document.querySelectorAll(".level-buttons button");

    if (level === 4) {
        buttons[0].classList.add("selected");
    }

    if (level === 6) {
        buttons[1].classList.add("selected");
    }

    if (level === 8) {
        buttons[2].classList.add("selected");
    }
}


/* =========================
   ČAS
   ========================= */

function selectTime(time) {

    selectedTime = time;

    document.querySelectorAll(".time-buttons button")
        .forEach(button => {
            button.classList.remove("selected");
        });

    const buttons =
        document.querySelectorAll(".time-buttons button");

    if (time === 3) {
        buttons[0].classList.add("selected");
    }

    if (time === 5) {
        buttons[1].classList.add("selected");
    }

    if (time === 10) {
        buttons[2].classList.add("selected");
    }

    if (time === 15) {
        buttons[3].classList.add("selected");
    }
}


/* =========================
   ZAČIATOK HRY
   ========================= */

function startGame() {

    document.getElementById("setupScreen")
        .classList.remove("active");

    document.getElementById("gameScreen")
        .classList.add("active");

    newGame();
}


/* =========================
   NOVÁ HRA
   ========================= */

function newGame() {

    clearInterval(timerInterval);

    attempts = 0;

    selectedAnswers = [];

    gameFinished = false;

    const source =
        items[selectedTheme][selectedNameLanguage];

    const shuffled =
        [...source].sort(() => Math.random() - 0.5);

    currentItems =
        shuffled.slice(0, selectedLevel);

    const t = texts[currentLanguage];

    let instruction =
        t.instructions4;

    if (selectedLevel === 6) {
        instruction = t.instructions6;
    }

    if (selectedLevel === 8) {
        instruction = t.instructions8;
    }

    document.getElementById("instructions")
        .textContent = instruction;

    document.getElementById("message")
        .textContent = "";

    document.getElementById("memoryItems")
        .innerHTML = "";

    document.getElementById("answers")
        .innerHTML = "";

    updateStats();

    showMemory();
}


/* =========================
   ZOBRAZENIE VECÍ
   ========================= */

function showMemory() {

    const container =
        document.getElementById("memoryItems");

    currentItems.forEach(item => {

        const div =
            document.createElement("div");

        div.className = "memory-item";

        div.innerHTML =
            `<span class="emoji">${item[0]}</span>${item[1]}`;

        container.appendChild(div);
    });

    setTimeout(() => {

        container.innerHTML = "";

        showAnswers();

        startTimer();

    }, selectedTime * 1000);
}


/* =========================
   ODPOVEDE
   ========================= */

function showAnswers() {

    const container =
        document.getElementById("answers");

    const allItems =
        items[selectedTheme][selectedNameLanguage];

    const correctItems =
        [...currentItems];

    const wrongItems =
        allItems
        .filter(item =>
            !currentItems.some(
                correct => correct[1] === item[1]
            )
        )
        .sort(() => Math.random() - 0.5)
        .slice(0, 4);

    const answerItems =
        [...correctItems, ...wrongItems]
        .sort(() => Math.random() - 0.5);

    answerItems.forEach(item => {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.dataset.answer = item[1];

        button.innerHTML =
            `<span class="emoji">${item[0]}</span>${item[1]}`;

        button.onclick = () =>
            selectAnswer(button, item);

        container.appendChild(button);
    });
}


/* =========================
   VÝBER ODPOVEDE
   ========================= */

function selectAnswer(button, item) {

    if (gameFinished) {
        return;
    }

    if (selectedAnswers.includes(item[1])) {
        return;
    }

    if (attempts >= selectedLevel) {
        return;
    }

    selectedAnswers.push(item[1]);

    attempts++;

    const correct =
        currentItems.some(
            x => x[1] === item[1]
        );

    if (correct) {

        button.classList.add("correct");

    } else {

        button.classList.add("incorrect");

    }

    updateStats();

    if (attempts === selectedLevel) {

        finishGame();

    }
}


/* =========================
   VYHODNOTENIE HRY
   ========================= */

function finishGame() {

    if (gameFinished) {
        return;
    }

    gameFinished = true;

    clearInterval(timerInterval);

    const correctAnswers =
        selectedAnswers.filter(answer =>
            currentItems.some(
                item => item[1] === answer
            )
        ).length;


    document.querySelectorAll(".answer")
        .forEach(button => {

            const answer =
                button.dataset.answer;

            const isCorrect =
                currentItems.some(
                    item => item[1] === answer
                );

            const wasSelected =
                selectedAnswers.includes(answer);

            if (isCorrect && !wasSelected) {

                button.classList.add("missed");

            }
        });


    const t =
        texts[currentLanguage];


    /*
       ÚPLNE SPRÁVNE
    */

    if (correctAnswers === currentItems.length) {

        document.getElementById("message")
            .textContent = t.success;


        /*
           SILNÉ KONFETY ZHORA
        */

        if (typeof confetti === "function") {

            const duration = 3000;
            const end = Date.now() + duration;

            (function frame() {

                confetti({
                    particleCount: 12,
                    angle: 60,
                    spread: 65,
                    startVelocity: 38,
                    gravity: 0.75,
                    ticks: 250,
                    origin: {
                        x: 0,
                        y: 0
                    }
                });

                confetti({
                    particleCount: 12,
                    angle: 120,
                    spread: 65,
                    startVelocity: 38,
                    gravity: 0.75,
                    ticks: 250,
                    origin: {
                        x: 1,
                        y: 0
                    }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }

            }());

        }

    } else {

        /*
           ČIASTOČNÝ VÝSLEDOK
        */

        document.getElementById("message")
            .textContent =
            `${t.correct} ${correctAnswers}/${currentItems.length}`;
    }


    const elapsedSeconds =
        Math.floor(
            (Date.now() - startTime) / 1000
        );


    if (
        bestAttempts === null ||
        attempts < bestAttempts
    ) {

        bestAttempts = attempts;

        bestTime = elapsedSeconds;

    }


    updateStats();
}


/* =========================
   ČASOVAČ
   ========================= */

function startTimer() {

    startTime = Date.now();

    clearInterval(timerInterval);

    timerInterval =
        setInterval(() => {

            if (gameFinished) {
                return;
            }

            const elapsed =
                Math.floor(
                    (Date.now() - startTime) / 1000
                );

            const minutes =
                Math.floor(elapsed / 60);

            const seconds =
                String(elapsed % 60)
                .padStart(2, "0");

            document.getElementById("time")
                .textContent =
                `${minutes}:${seconds}`;

        }, 1000);
}


/* =========================
   ŠTATISTIKY
   ========================= */

function updateStats() {

    const t =
        texts[currentLanguage];

    document.getElementById("attemptsLabel")
        .textContent = t.attempts;

    document.getElementById("timeLabel")
        .textContent = t.time;

    document.getElementById("bestLabel")
        .textContent = t.best;

    document.getElementById("attempts")
        .textContent = attempts;


    if (bestAttempts === null) {

        document.getElementById("best")
            .textContent = "–";

    } else {

        const minutes =
            Math.floor(bestTime / 60);

        const seconds =
            String(bestTime % 60)
            .padStart(2, "0");

        document.getElementById("best")
            .textContent =
            `${bestAttempts} / ${minutes}:${seconds}`;
    }
}

</script>
